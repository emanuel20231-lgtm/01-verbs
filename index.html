<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verbos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #1e2530;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* Botão de Lista (Sempre visível no topo esquerdo) */
    .btn-lista {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 100;
      background-color: rgba(30, 37, 48, 0.9);
      color: #ffffff;
      border: 2px solid #ffffff;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-lista:hover {
      background-color: #ffffff;
      color: #1e2530;
    }

    /* Menu Lateral */
    .sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background-color: #161b22;
      z-index: 200;
      transition: left 0.3s ease;
      padding: 60px 20px 20px 20px;
      overflow-y: auto;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.5);
    }

    .sidebar.open {
      left: 0;
    }

    .sidebar ul {
      list-style: none;
    }

    .sidebar li {
      margin-bottom: 12px;
    }

    .sidebar a {
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      display: block;
      padding: 8px 12px;
      border-radius: 6px;
      transition: background-color 0.2s ease;
    }

    .sidebar a:hover, .sidebar a.active {
      background-color: #2b3544;
      color: #60a5fa;
      font-weight: bold;
    }

    /* Container do Iframe */
    .content-container {
      width: 100%;
      height: 100%;
      background-color: #1e2530;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background-color: #1e2530;
    }

    /* NAVEGAÇÃO INFERIOR (Sempre visível e centralizado) */
    .nav-controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 15px;
      background-color: rgba(22, 27, 34, 0.9);
      padding: 8px 20px;
      border-radius: 25px;
      border: 1px solid #3b4758;
    }

    .nav-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, color 0.2s ease;
    }

    .nav-btn:hover:not(:disabled) {
      color: #60a5fa;
      transform: scale(1.2);
    }

    .nav-btn:disabled {
      color: #555555;
      cursor: not-allowed;
    }

    .counter {
      color: #ffffff;
      font-weight: bold;
      font-size: 16px;
      user-select: none;
    }
  </style>
</head>
<body>

  <!-- Botão para abrir o menu -->
  <button class="btn-lista" onclick="toggleMenu()">Lista</button>

  <!-- Menu Lateral -->
  <div class="sidebar" id="sidebar">
    <ul id="verb-list">
      <!-- Adicione seus novos arquivos aqui -->
      <li><a href="01-To collaborate.html">01 - To collaborate</a></li>
      <li><a href="02-To Wash.html">02 - To Wash</a></li>
      <li><a href="03-To knock.html">03 - To knock</a></li>
    </ul>
  </div>

  <!-- Exibição das páginas -->
  <div class="content-container">
    <iframe id="content"></iframe>
  </div>

  <!-- Controles Inferiores (Retroceder / Fração / Avançar) -->
  <div class="nav-controls">
    <button class="nav-btn" id="btn-prev" onclick="navegar(-1)">&#9664;</button>
    <span class="counter" id="counter">1/3</span>
    <button class="nav-btn" id="btn-next" onclick="navegar(1)">&#9654;</button>
  </div>

  <script>
    let currentIndex = 0;
    const links = document.querySelectorAll('#verb-list a');
    const total = links.length;
    const iframe = document.getElementById('content');
    const counter = document.getElementById('counter');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const sidebar = document.getElementById('sidebar');

    function updateView(index) {
      if (total === 0) return;
      currentIndex = index;
      iframe.src = links[currentIndex].getAttribute('href');
      
      links.forEach((link, i) => {
        link.classList.toggle('active', i === currentIndex);
      });
      
      counter.textContent = `${currentIndex + 1}/${total}`;
      btnPrev.disabled = currentIndex === 0;
      btnNext.disabled = currentIndex === total - 1;
    }

    function navegar(direction) {
      const newIndex = currentIndex + direction;
      if (newIndex >= 0 && newIndex < total) {
        updateView(newIndex);
      }
    }

    function toggleMenu() {
      sidebar.classList.toggle('open');
    }

    links.forEach((link, index) => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        updateView(index);
        sidebar.classList.remove('open');
      });
    });

    // Inicializa a primeira página da lista
    updateView(0);
  </script>
</body>
</html>
