<script>
    let currentIndex = 0;
    const links = document.querySelectorAll('#verb-list a');
    const total = links.length;
    const iframe = document.getElementById('content');
    const counter = document.getElementById('counter');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const sidebar = document.getElementById('sidebar');

    function updateView(index) {
      currentIndex = index;
      iframe.src = links[currentIndex].getAttribute('href');
      links.forEach((link, i) => {
        link.classList.toggle('active', i === currentIndex);
      });
      counter.textContent = `${currentIndex + 1}/${total}`;
      btnPrev.disabled = currentIndex === 0;
      btnNext.disabled = currentIndex === total - 1;
    }

    function navegar(direction) {
      const newIndex = currentIndex + direction;
      if (newIndex >= 0 && newIndex < total) {
        updateView(newIndex);
      }
    }

    function toggleMenu() {
      sidebar.classList.toggle('open');
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      applyDarkToIframe();
    }

    // Estiliza de forma abrangente o conteúdo interno do iframe no modo escuro
    function applyDarkToIframe() {
      try {
        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
        if (!iframeDoc || !iframeDoc.body) return;

        let darkStyle = iframeDoc.getElementById('custom-dark-style');

        if (document.body.classList.contains('dark-mode')) {
          if (!darkStyle) {
            darkStyle = iframeDoc.createElement('style');
            darkStyle.id = 'custom-dark-style';
            iframeDoc.head.appendChild(darkStyle);
          }
          
          darkStyle.innerHTML = `
            body {
              background-color: #323b4c !important;
              color: #e2e8f0 !important;
            }
            h1, h2, h3, h4, header, div, span, p, label {
              color: #ffffff !important;
            }
            p.subtext, small, .help-text, caption {
              color: #cbd5e1 !important;
            }
            /* Converte blocos/cards brancos para escuro com texto visível */
            .card, .item, .row, .box, div[style*="background"], table, tr, td {
              background-color: #252c38 !important;
              color: #ffffff !important;
              border-color: #4a566d !important;
            }
            /* Transcrições fonéticas e traduções */
            .ipa, .phonetic, [class*="ipa"], [class*="phonetic"] {
              color: #94a3b8 !important;
            }
            .translation, .traducao, [class*="trans"] {
              color: #60a5fa !important;
            }
          `;
        } else {
          if (darkStyle) {
            darkStyle.remove();
          }
          iframeDoc.body.style.backgroundColor = '';
          iframeDoc.body.style.color = '';
        }
      } catch (e) {
        // Trata eventuais restrições do navegador
      }
    }

    iframe.addEventListener('load', applyDarkToIframe);

    links.forEach((link, index) => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        updateView(index);
        sidebar.classList.remove('open');
      });
    });

    updateView(0);
  </script>
