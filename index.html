<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocabulário</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #323b4c;
      color: #ffffff;
      overflow: hidden;
      height: 100vh;
      display: flex;
    }

    /* Menu Lateral / Sidebar */
    #sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background-color: #1e2530;
      box-shadow: 2px 0 10px rgba(0,0,0,0.5);
      transition: left 0.3s ease;
      z-index: 1000;
      padding: 20px 10px;
      overflow-y: auto;
    }

    #sidebar.open {
      left: 0;
    }

    #sidebar h2 {
      color: #ffffff;
      margin-bottom: 15px;
      font-size: 1.2rem;
      text-align: center;
      border-bottom: 1px solid #3a4556;
      padding-bottom: 10px;
    }

    #verb-list {
      list-style: none;
    }

    #verb-list li {
      margin-bottom: 5px;
    }

    #verb-list a {
      display: block;
      padding: 10px 15px;
      color: #ffffff;
      text-decoration: none;
      border-radius: 5px;
      transition: background 0.2s;
    }

    #verb-list a:hover, #verb-list a.active {
      background-color: #252c38;
      color: #60a5fa;
      font-weight: bold;
    }

    /* Topo Fixado */
    #top-bar {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 100;
    }

    .btn-lista {
      background-color: #ffffff;
      color: #d97706;
      border: 2px solid #d97706;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
    }

    /* Container Principal */
    #main-container {
      flex: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background-color: #323b4c;
    }

    /* Barra Inferior de Navegação */
    #bottom-bar {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: rgba(25, 31, 41, 0.95);
      border: 1px solid #4a566d;
      padding: 6px 20px;
      border-radius: 25px;
      z-index: 100;
      color: #ffffff;
      font-weight: bold;
    }

    .nav-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:disabled {
      color: #526077;
      cursor: not-allowed;
    }

    #counter {
      color: #ffffff;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <!-- Botão de abrir menu -->
  <div id="top-bar">
    <button class="btn-lista" onclick="toggleMenu()">Lista</button>
  </div>

  <!-- Menu Lateral de Verbos -->
  <div id="sidebar">
    <h2>Lista de Verbos</h2>
    <ul id="verb-list">
      <!-- Adicione os novos links dos verbos aqui conforme for enviando os arquivos -->
      <li><a href="01-To collaborate.html">01 - To collaborate</a></li>
      <li><a href="02-To Wash.html">02 - To Wash</a></li>
      <li><a href="03-To knock.html">03 - To knock</a></li>
    </ul>
  </div>

  <!-- Exibição do Conteúdo -->
  <div id="main-container">
    <iframe id="content" src=""></iframe>
  </div>

  <!-- Controles Inferiores (Voltar / Contador / Avançar) -->
  <div id="bottom-bar">
    <button class="nav-btn" id="btn-prev" onclick="navegar(-1)">&#9664;</button>
    <span id="counter">1/1</span>
    <button class="nav-btn" id="btn-next" onclick="navegar(1)">&#9654;</button>
  </div>

  <script>
    let currentIndex = 0;
    const links = document.querySelectorAll('#verb-list a');
    const total = links.length;
    const iframe = document.getElementById('content');
    const counter = document.getElementById('counter');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const sidebar = document.getElementById('sidebar');

    function updateView(index) {
      if (total === 0) return;
      currentIndex = index;
      iframe.src = links[currentIndex].getAttribute('href');
      links.forEach((link, i) => {
        link.classList.toggle('active', i === currentIndex);
      });
      counter.textContent = `${currentIndex + 1}/${total}`;
      btnPrev.disabled = currentIndex === 0;
      btnNext.disabled = currentIndex === total - 1;
    }

    function navegar(direction) {
      const newIndex = currentIndex + direction;
      if (newIndex >= 0 && newIndex < total) {
        updateView(newIndex);
      }
    }

    function toggleMenu() {
      sidebar.classList.toggle('open');
    }

    links.forEach((link, index) => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        updateView(index);
        sidebar.classList.remove('open');
      });
    });

    if (total > 0) {
      updateView(0);
    }
  </script>
</body>
</html>
