<title>Learn English</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%; height: 100%;
    background-color: #0f1720;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #ffffff;
    overflow: hidden;
  }

  /* ------------------------------------------------------------------
     SPLASH SCREEN
  ------------------------------------------------------------------ */
  #splash-screen {
    position: fixed; inset: 0;
    background: radial-gradient(circle at 30% 20%, #1e293b, #0c1a28 70%);
    z-index: 99999;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  #splash-screen.hidden { opacity: 0; visibility: hidden; }

  .splash-content {
    display: flex; flex-direction: column; align-items: center; gap: 15px;
  }
  .clock-face {
    width: 44px; height: 44px;
    border: 2px solid #ffffff; border-radius: 50%;
    position: relative; background-color: #242f44;
  }
  .hand {
    position: absolute; bottom: 50%; left: 50%;
    transform-origin: bottom center; background-color: #60a5fa;
    border-radius: 2px;
  }
  .hour-hand   { width: 2px; height: 11px; margin-left: -1px; }
  .minute-hand { width: 2px; height: 15px; margin-left: -1px; background-color: #ffc107;
                 animation: spin 1.5s linear infinite; }
  @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  .clock-label { font-size: 13px; color: #99f4d6; font-weight: bold; letter-spacing: 1px; }

  .splash-title {
    font-size: 24px; color: #5eead4; font-weight: bold;
    letter-spacing: 2px; margin-top: 15px;
  }

  /* ------------------------------------------------------------------
     TELAS (uma "tela" do app por vez)
  ------------------------------------------------------------------ */
  .screen {
    position: fixed; inset: 0;
    display: none;
    flex-direction: column;
    background-color: #0f1720;
    overflow: hidden;
  }
  .screen.active { display: flex; }

  /* ------------------------------------------------------------------
     HOME
  ------------------------------------------------------------------ */
  #home-screen {
    background:
      radial-gradient(circle at 20% 10%, rgba(96,165,250,0.12), transparent 45%),
      radial-gradient(circle at 80% 90%, rgba(94,234,212,0.10), transparent 45%),
      #0f1720;
    overflow-y: auto;
    padding: 20px 0 40px;
  }

  .home-title {
    text-align: center;
    font-size: 22px;
    color: #5eead4;
    letter-spacing: 2px;
    font-weight: bold;
    margin: 10px 0 25px;
  }

  .icon-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px 14px;
    padding: 0 18px;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
  }
  @media (min-width: 640px) {
    .icon-grid { grid-template-columns: repeat(5, 1fr); gap: 26px 20px; max-width: 720px; }
  }
  @media (min-width: 900px) {
    .icon-grid { grid-template-columns: repeat(6, 1fr); max-width: 900px; }
  }

  .app-icon {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    cursor: pointer;
    transition: transform 0.15s ease;
    user-select: none;
  }
  .app-icon:active { transform: scale(0.92); }

  .app-icon-img {
    width: 68px; height: 68px;
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px;
    box-shadow: 0 6px 14px rgba(0,0,0,0.45), inset 0 -3px 6px rgba(0,0,0,0.15);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .app-icon-label {
    font-size: 11.5px; color: #ffffff;
    font-weight: 600; text-align: center; line-height: 1.2;
    max-width: 90px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ------------------------------------------------------------------
     FOLDER SCREEN (pasta aberta em tela cheia)
  ------------------------------------------------------------------ */
  .folder-header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px 10px;
    border-bottom: 1px solid #1e293b;
    background-color: #0f1720;
    flex-shrink: 0;
  }
  .folder-header h2 {
    font-size: 17px;
    color: #99f4d6;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .btn-back {
    background-color: #161b22;
    color: #99f4d6;
    border: 1px solid #3b4758;
    padding: 8px 14px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.2s;
    flex-shrink: 0;
    line-height: 1;
  }
  .btn-back:hover { background-color: #2b3544; }

  .folder-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px 0 60px;
    -webkit-overflow-scrolling: touch;
  }

  /* ------------------------------------------------------------------
     LISTA DE LINKS (dentro de uma subpasta)
  ------------------------------------------------------------------ */
  .link-list {
    display: flex; flex-direction: column;
    gap: 6px;
    padding: 0 18px;
    max-width: 640px;
    margin: 0 auto;
  }
  .link-list a {
    display: block;
    color: #5eead4;
    text-decoration: none;
    font-size: 17px;
    font-weight: 500;
    padding: 14px 16px;
    border-radius: 10px;
    background-color: #161b22;
    border: 1px solid #1e293b;
    transition: all 0.15s ease;
  }
  .link-list a:hover, .link-list a:active {
    background-color: #1e293b;
    color: #ffffff;
    transform: translateX(3px);
  }

  .empty-msg {
    text-align: center;
    color: #64748b;
    font-size: 15px;
    padding: 40px 20px;
    font-style: italic;
  }

  /* ------------------------------------------------------------------
     CONTENT SCREEN (iframe + voltar)
  ------------------------------------------------------------------ */

  #content-screen iframe {
    flex: 1; width: 100%; border: none;
    background-color: #1e2530;
  }

  /* ------------------------------------------------------------------
     NAV CONTROLS < 1/3 >
  ------------------------------------------------------------------ */
  .nav-controls {
    position: fixed;
    bottom: 22px; left: 50%;
    transform: translateX(-50%);
    z-index: 9997;
    display: none;
    align-items: center;
    gap: 16px;
    background-color: rgba(22, 27, 34, 0.96);
    padding: 8px 22px;
    border-radius: 30px;
    border: 1px solid #3b4758;
    box-shadow: 0 6px 16px rgba(0,0,0,0.5);
    backdrop-filter: blur(6px);
  }
  .nav-controls.visible { display: flex !important; }

  .nav-btn {
    background: none; border: none;
    color: #ffffff; font-size: 22px;
    cursor: pointer; padding: 4px 6px;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.1s ease, color 0.2s ease;
    line-height: 1;
  }
  .nav-btn:hover:not(:disabled) { color: #60a5fa; transform: scale(1.15); }
  .nav-btn:disabled { color: #475569; cursor: not-allowed; }

  .counter {
    color: #ffffff; font-weight: bold; font-size: 16px;
    user-select: none; min-width: 46px; text-align: center;
  }
</style>

      {
        id: 'gt-03', name: 'Game 03', icon: '⏱️',
        color: 'linear-gradient(135deg, #854d0e, #ca8a04)',
        hasNav: false,
        links: []
      }
    ]
  }
];

/* =====================================================================
   ESTADO
   ===================================================================== */
let activeLinks = [];       // links da subpasta atual (para navegação)
let currentIndex = 0;
let currentFolderId = null;
let currentSubfolderId = null;
let currentView = 'home';   // 'home' | 'folder' | 'subfolder' | 'content'

const iframe = document.getElementById('content');
const splash = document.getElementById('splash-screen');

/* =====================================================================
   SPLASH INICIAL
   ===================================================================== */
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => splash && splash.classList.add('hidden'), 3500);
});

/* =====================================================================
   HELPERS
   ===================================================================== */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) el.classList.add('active');
}

function getFolder(id) { return appData.find(f => f.id === id); }
function getSubfolder(folderId, subId) {
  const f = getFolder(folderId);
  return f ? f.subfolders.find(s => s.id === subId) : null;
}

/* =====================================================================
   RENDER HOME
   ===================================================================== */
function renderHome() {
  const grid = document.getElementById('home-grid');
  grid.innerHTML = '';
  appData.forEach(folder => {
    const tile = document.createElement('div');
    tile.className = 'app-icon';
    tile.innerHTML = `
      <div class="app-icon-img" style="background:${folder.color}">${folder.icon}</div>
      <div class="app-icon-label">${folder.name}</div>
    `;
    tile.addEventListener('click', () => openFolder(folder.id));
    grid.appendChild(tile);
  });
}

/* =====================================================================
   ABRIR PASTA MÃE
   ===================================================================== */
function openFolder(folderId) {
  currentFolderId = folderId;
  currentSubfolderId = null;
  currentView = 'folder';
  renderFolderView();
  showScreen('folder-screen');
  // scroll para o topo sempre que abrir
  const body = document.getElementById('folder-body');
  if (body) body.scrollTop = 0;
}

/* =====================================================================
   RENDERIZAR PASTA (ícones das subpastas)
   ===================================================================== */
function renderFolderView() {
  const folder = getFolder(currentFolderId);
  if (!folder) return;

  document.getElementById('folder-title-text').textContent = folder.icon + '  ' + folder.name;

  const body = document.getElementById('folder-body');
  body.innerHTML = '';

  const grid = document.createElement('div');
  grid.className = 'icon-grid';

  folder.subfolders.forEach(sf => {
    const tile = document.createElement('div');
    tile.className = 'app-icon';
    tile.innerHTML = `
      <div class="app-icon-img" style="background:${sf.color}">${sf.icon}</div>
      <div class="app-icon-label">${sf.name}</div>
    `;
    tile.addEventListener('click', () => openSubfolder(sf.id));
    grid.appendChild(tile);
  });

  body.appendChild(grid);
}

/* =====================================================================
   ABRIR SUBPASTA (lista de links)
   ===================================================================== */
function openSubfolder(subfolderId) {
  currentSubfolderId = subfolderId;
  currentView = 'subfolder';
  renderSubfolderView();
  const body = document.getElementById('folder-body');
  if (body) body.scrollTop = 0;
}

function renderSubfolderView() {
  const folder = getFolder(currentFolderId);
  const sf = getSubfolder(currentFolderId, currentSubfolderId);
  if (!folder || !sf) return;

  document.getElementById('folder-title-text').textContent =
    folder.icon + '  ' + folder.name + '  ›  ' + sf.name;

  const body = document.getElementById('folder-body');
  body.innerHTML = '';

  if (!sf.links || sf.links.length === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-msg';
    msg.textContent = 'Em breve…';
    body.appendChild(msg);
    return;
  }

  const list = document.createElement('div');
  list.className = 'link-list';

  sf.links.forEach((link, i) => {
    const a = document.createElement('a');
    a.href = '#';
    a.textContent = link.name;
    a.addEventListener('click', (e) => {
      e.preventDefault();
      openLink(sf, i);
    });
    list.appendChild(a);
  });

  body.appendChild(list);
}

/* =====================================================================
   ABRIR LINK (iframe + splash + contador)
   ===================================================================== */
function openLink(subfolder, index) {
  activeLinks = subfolder.links.slice();
  currentIndex = index;

  document.getElementById('content-title').textContent = subfolder.name;

  // Splash
  splash.classList.remove('hidden');

  setTimeout(() => {
    // Carrega iframe
    const link = activeLinks[currentIndex];
    iframe.src = link.href;

    // Verifica hasNav: sobe hierarquia até encontrar explícito
    const showNav = resolveHasNav(currentFolderId, currentSubfolderId);
    const nav = document.getElementById('counter-container');
    if (showNav) {
      nav.classList.add('visible');
      nav.style.setProperty('display', 'flex', 'important');
    } else {
      nav.classList.remove('visible');
      nav.style.setProperty('display', 'none', 'important');
    }

    updateCounter();

    showScreen('content-screen');
    currentView = 'content';

    splash.classList.add('hidden');
  }, 1500);
}

/* Verifica hasNav: subpasta → pasta mãe.
   Se a subpasta tiver hasNav definido (true/false), usa ele.
   Se for null/undefined, herda do pai. */
function resolveHasNav(folderId, subfolderId) {
  const sf = getSubfolder(folderId, subfolderId);
  if (sf && typeof sf.hasNav === 'boolean') return sf.hasNav;
  const f = getFolder(folderId);
  return !!(f && f.hasNav);
}

/* =====================================================================
   CONTADOR + BOTÕES
   ===================================================================== */
function updateCounter() {
  const idxEl   = document.getElementById('current-index');
  const totEl   = document.getElementById('total-count');
  const prevBtn = document.getElementById('btn-prev');
  const nextBtn = document.getElementById('btn-next');

  if (!activeLinks || activeLinks.length === 0) {
    idxEl.textContent = '0';
    totEl.textContent = '0';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    return;
  }
  idxEl.textContent = currentIndex + 1;
  totEl.textContent = activeLinks.length;
  prevBtn.disabled = currentIndex === 0;
  nextBtn.disabled = currentIndex === activeLinks.length - 1;
}

function navegar(direction) {
  if (!activeLinks || activeLinks.length === 0) return;
  const newIndex = currentIndex + direction;
  if (newIndex < 0 || newIndex >= activeLinks.length) return;

  currentIndex = newIndex;

  // Splash rápido entre navegações (curto para não travar)
  splash.classList.remove('hidden');
  setTimeout(() => {
    iframe.src = activeLinks[currentIndex].href;
    updateCounter();
    splash.classList.add('hidden');
  }, 600);
}

/* =====================================================================
   NAVEGAÇÃO "VOLTAR"
   ===================================================================== */
function goBack() {
  if (currentView === 'subfolder') {
    // Volta para os ícones das subpastas
    currentSubfolderId = null;
    currentView = 'folder';
    renderFolderView();
  } else if (currentView === 'folder') {
    // Volta para a home
    currentFolderId = null;
    currentView = 'home';
    showScreen('home-screen');
  }
}

function closeContent() {
  // Volta para a subpasta que continha o link
  const nav = document.getElementById('counter-container');
  nav.classList.remove('visible');
  nav.style.setProperty('display', 'none', 'important');

  iframe.src = 'about:blank';

  if (currentFolderId && currentSubfolderId) {
    currentView = 'subfolder';
    renderSubfolderView();
    showScreen('folder-screen');
  } else if (currentFolderId) {
    currentView = 'folder';
    renderFolderView();
    showScreen('folder-screen');
  } else {
    currentView = 'home';
    showScreen('home-screen');
  }
}

/* =====================================================================
   INICIALIZA
   ===================================================================== */
renderHome();
showScreen('home-screen');
</script>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    if (!localStorage.getItem('minhaVelocidadeVoz')) {
      const velocidadePadrao = isMobile ? "0.5" : "0.65";
      localStorage.setItem('minhaVelocidadeVoz', velocidadePadrao);
    }
  });
</script>
