<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocabulário</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #1e2530 !important;
      font-family: Arial, sans-serif;
      overflow: hidden;
      color: #ffffff;
    }

    /* Botão Lista (Sempre visível no topo esquerdo) */
    .btn-lista {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 9999;
      background-color: #161b22;
      color: #ffffff;
      border: 2px solid #ffffff;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .btn-lista:hover {
      background-color: #ffffff;
      color: #1e2530;
    }

    /* BANNER DE NOME E ÁGUIA (Sempre visível no topo direito) */
    .brand-container {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: rgba(22, 27, 34, 0.85);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #3b4758;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      pointer-events: none; /* Evita bloquear cliques abaixo se necessário */
    }

    .brand-text {
      color: #ffffff;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
    }

    .brand-eagle {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    /* Ajuste para Celulares (Diminui o tamanho para não cobrir o conteúdo) */
    @media (max-width: 600px) {
      .brand-container {
        top: 10px;
        right: 10px;
        padding: 4px 10px;
        gap: 6px;
      }

      .brand-text {
        font-size: 11px;
      }

      .brand-eagle {
        width: 20px;
        height: 20px;
      }

      .btn-lista {
        top: 10px;
        left: 10px;
        padding: 6px 12px;
        font-size: 13px;
      }
    }

    /* Menu Lateral */
    .sidebar {
      position: fixed;
      top: 0;
      left: -300px;
      width: 300px;
      height: 100%;
      background-color: #161b22;
      z-index: 9998;
      transition: left 0.3s ease;
      padding: 60px 15px 20px 15px;
      overflow-y: auto;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.5);
    }

    .sidebar.open {
      left: 0;
    }

    /* Estilo das Pastas */
    .folder {
      margin-bottom: 8px;
    }

    .folder-title {
      width: 100%;
      background-color: #252c38;
      color: #ffffff;
      border: 1px solid #3b4758;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background-color 0.2s ease;
    }

    .folder-title:hover {
      background-color: #2b3544;
    }

    .folder-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
      padding-left: 10px;
    }

    .folder.active .folder-content {
      max-height: 2000px;
      margin-top: 5px;
    }

    .folder.active .folder-arrow {
      transform: rotate(90deg);
    }

    .folder-arrow {
      transition: transform 0.2s ease;
      font-size: 12px;
    }

    .folder-content ul {
      list-style: none;
    }

    .folder-content li {
      margin: 4px 0;
    }

    .folder-content a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 14px;
      display: block;
      padding: 8px 12px;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .folder-content a:hover {
      background-color: #2b3544;
      color: #ffffff;
    }

    .folder-content a.active {
      background-color: #3b4758;
      color: #60a5fa;
      font-weight: bold;
    }

    /* Área Principal */
    .content-container {
      width: 100%;
      height: 100%;
      background-color: #1e2530;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background-color: #1e2530;
    }

    /* Navegação Inferior */
    .nav-controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9997;
      display: flex;
      align-items: center;
      gap: 15px;
      background-color: #161b22;
      padding: 8px 20px;
      border-radius: 25px;
      border: 1px solid #3b4758;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .nav-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, color 0.2s ease;
    }

    .nav-btn:hover:not(:disabled) {
      color: #60a5fa;
      transform: scale(1.2);
    }

    .nav-btn:disabled {
      color: #555555;
      cursor: not-allowed;
    }

    .counter {
      color: #ffffff;
      font-weight: bold;
      font-size: 16px;
      user-select: none;
    }
  </style>
</head>
<body>

  <!-- Botão de Lista -->
  <button class="btn-lista" onclick="toggleMenu()">Lista</button>

  <!-- Marca Emanuel learn + Águia dos EUA (Topo Direito) -->
  <div class="brand-container">
    <span class="brand-text">Emanuel learn</span>
    <img class="brand-eagle" src="https://upload.wikimedia.org/wikipedia/commons/8/82/Great_Seal_of_the_United_States_%2(Obverse%).svg" alt="Águia EUA" onerror="this.src='https://cdn-icons-png.flaticon.com/512/8242/8242880.png'">
  </div>

  <!-- Menu Lateral -->
  <div class="sidebar" id="sidebar">
    
    <div class="folder">
      <button class="folder-title" onclick="toggleFolder(this)">
        📁 🇺🇸 01 - Verbos <span class="folder-arrow">▶</span>
      </button>
      <div class="folder-content">
        <ul>
          <!-- Adicione seus links de verbos aqui -->
        </ul>
      </div>
    </div>

    <div class="folder">
      <button class="folder-title" onclick="toggleFolder(this)">
        📁 📚 02 - Substantivos <span class="folder-arrow">▶</span>
      </button>
      <div class="folder-content">
        <ul>
          <!-- Adicione seus links de substantivos aqui -->
        </ul>
      </div>
    </div>

    <div class="folder">
      <button class="folder-title" onclick="toggleFolder(this)">
        📁 🎮 Jogos <span class="folder-arrow">▶</span>
      </button>
      <div class="folder-content">
        <ul>
          <!-- Adicione seus links de jogos aqui -->
        </ul>
      </div>
    </div>

  </div>

  <!-- Container do iframe -->
  <div class="content-container">
    <iframe id="content"></iframe>
  </div>

  <!-- Controles Inferiores -->
  <div class="nav-controls">
    <button class="nav-btn" id="btn-prev" onclick="navegar(-1)">&#9664;</button>
    <span class="counter" id="counter">0/0</span>
    <button class="nav-btn" id="btn-next" onclick="navegar(1)">&#9654;</button>
  </div>

  <script>
    let activeLinks = [];
    let currentIndex = 0;

    const iframe = document.getElementById('content');
    const counter = document.getElementById('counter');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const sidebar = document.getElementById('sidebar');

    function toggleMenu() {
      sidebar.classList.toggle('open');
    }

    function toggleFolder(element) {
      const folder = element.parentElement;
      folder.classList.toggle('active');
    }

    function setupLinks() {
      const allLinks = document.querySelectorAll('.folder-content a');
      
      allLinks.forEach((link) => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          
          const parentFolder = link.closest('.folder-content');
          activeLinks = Array.from(parentFolder.querySelectorAll('a'));
          currentIndex = activeLinks.indexOf(link);

          allLinks.forEach(l => l.classList.remove('active'));
          link.classList.add('active');

          updateView();
          sidebar.classList.remove('open');
        });
      });
    }

    function updateView() {
      if (activeLinks.length === 0) {
        counter.textContent = "0/0";
        btnPrev.disabled = true;
        btnNext.disabled = true;
        return;
      }

      iframe.src = activeLinks[currentIndex].getAttribute('href');
      counter.textContent = `${currentIndex + 1}/${activeLinks.length}`;
      btnPrev.disabled = currentIndex === 0;
      btnNext.disabled = currentIndex === activeLinks.length - 1;
    }

    function navegar(direction) {
      const newIndex = currentIndex + direction;
      if (newIndex >= 0 && newIndex < activeLinks.length) {
        currentIndex = newIndex;
        
        document.querySelectorAll('.folder-content a').forEach(l => l.classList.remove('active'));
        activeLinks[currentIndex].classList.add('active');
        
        updateView();
      }
    }

    setupLinks();
    updateView();
  </script>
</body>
</html>
