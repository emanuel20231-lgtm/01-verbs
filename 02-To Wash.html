<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wash — IPA e áudio</title>
<style>
body{font-family:Arial,sans-serif;max-width:850px;margin:35px auto;padding:0 18px;background:#f6f6f6;color:#222}
h1{margin-bottom:6px} .sub{color:#555;margin-bottom:24px}
.card{background:white;border-radius:15px;padding:18px 20px;margin:13px 0;display:grid;grid-template-columns:1fr 2.2fr auto;gap:18px;align-items:center;box-shadow:0 2px 8px #0001}
.word{font-size:25px;font-weight:700} .ipa{font-size:19px;font-family:"DejaVu Sans",Arial,sans-serif}
.buttons{display:flex;gap:8px} button{border:0;border-radius:9px;padding:10px 12px;cursor:pointer;background:#222;color:white;font-size:15px}
button:hover{opacity:.82} .note{margin-top:22px;color:#666;font-size:14px}
@media(max-width:700px){.card{grid-template-columns:1fr;gap:10px}.buttons{flex-wrap:wrap}}
</style>
</head>
<body>
<h1>Wash — palavra / IPA / áudio</h1>
<div class="sub">Clique em 🇬🇧 UK ou 🇺🇸 US para ouvir cada forma.</div>

    <div class="card">
      <div class="word">wash</div>
      <div class="ipa">/UK wɒʃ/   /US wɑːʃ/</div>
      <div class="buttons">
        <button onclick="speak(0,'en-GB')">🇬🇧 🔊 UK</button>
        <button onclick="speak(0,'en-US')">🇺🇸 🔊 US</button>
      </div>
    </div>
    
    <div class="card">
      <div class="word">washes</div>
      <div class="ipa">/UK ˈwɒʃ.ɪz/   /US ˈwɑːʃ.ɪz/</div>
      <div class="buttons">
        <button onclick="speak(1,'en-GB')">🇬🇧 🔊 UK</button>
        <button onclick="speak(1,'en-US')">🇺🇸 🔊 US</button>
      </div>
    </div>
    
    <div class="card">
      <div class="word">washing</div>
      <div class="ipa">/UK ˈwɒʃ.ɪŋ/   /US ˈwɑːʃ.ɪŋ/</div>
      <div class="buttons">
        <button onclick="speak(2,'en-GB')">🇬🇧 🔊 UK</button>
        <button onclick="speak(2,'en-US')">🇺🇸 🔊 US</button>
      </div>
    </div>
    
    <div class="card">
      <div class="word">washed</div>
      <div class="ipa">/UK wɒʃt/   /US wɑːʃt/</div>
      <div class="buttons">
        <button onclick="speak(3,'en-GB')">🇬🇧 🔊 UK</button>
        <button onclick="speak(3,'en-US')">🇺🇸 🔊 US</button>
      </div>
    </div>
    
<div class="note">A pronúncia é reproduzida pela síntese de voz do navegador.</div>
<script>
const words=['wash','washes','washing','washed'];
function speak(i,lang){
 if(!("speechSynthesis" in window)){alert("Seu navegador não oferece síntese de voz.");return;}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(words[i]); u.lang=lang; u.rate=.78; u.pitch=1;
 speechSynthesis.speak(u);
}
</script>
</body>
</html>
