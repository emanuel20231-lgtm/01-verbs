<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hear — palavra / IPA / áudio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;color:#111827;font-family:Arial,Helvetica,sans-serif}
.wrap{width:min(850px,calc(100% - 32px));margin:16px auto 40px}
h1{margin:0 0 8px;font-size:30px;letter-spacing:-.5px}
.subtitle{margin:0 0 26px;color:#4b5563;font-size:15px}
.row{background:#fff;border-radius:16px;min-height:76px;margin:0 0 12px;padding:14px 20px;display:grid;grid-template-columns:180px 1fr auto;align-items:center;gap:18px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.word{font-size:24px;font-weight:700}
.ipa{font-size:18px;white-space:nowrap}
.buttons{display:flex;gap:8px}
button{border:0;background:#222;color:#fff;border-radius:10px;padding:11px 13px;font-size:14px;cursor:pointer;transition:transform .08s,background .15s}
button:hover{background:#333}
button:active{transform:scale(.97)}
button.speaking{background:#075985}
.note{margin-top:20px;color:#64748b;font-size:14px}
@media(max-width:720px){.row{grid-template-columns:1fr;gap:10px}.ipa{white-space:normal}}
</style>
</head>
<body>
<div class="wrap">
<h1>Hear — palavra / IPA / áudio</h1>
<p class="subtitle">Clique em <b>UK</b> ou <b>US</b> para ouvir cada forma.</p>

<div class="row"><div class="word">hear</div><div class="ipa">/UK hɪə/ /US hɪr/</div><div class="buttons">
<button onclick="speak('hear','UK',this)">GB 🔊 UK</button><button onclick="speak('hear','US',this)">US 🔊 US</button></div></div>

<div class="row"><div class="word">hears</div><div class="ipa">/UK hɪəz/ /US hɪrz/</div><div class="buttons">
<button onclick="speak('hears','UK',this)">GB 🔊 UK</button><button onclick="speak('hears','US',this)">US 🔊 US</button></div></div>

<div class="row"><div class="word">hearing</div><div class="ipa">/UK ˈhɪə.rɪŋ/ /US ˈhɪr.ɪŋ/</div><div class="buttons">
<button onclick="speak('hearing','UK',this)">GB 🔊 UK</button><button onclick="speak('hearing','US',this)">US 🔊 US</button></div></div>

<div class="row"><div class="word">heard</div><div class="ipa">/US hɜːrd/</div><div class="buttons">
<button onclick="speak('heard','UK',this)">GB 🔊 UK</button><button onclick="speak('heard','US',this)">US 🔊 US</button></div></div>

<p class="note">A pronúncia é reproduzida pela síntese de voz do navegador.</p>
</div>
<script>
let voices=[];
function loadVoices(){voices=speechSynthesis.getVoices()}
loadVoices(); speechSynthesis.onvoiceschanged=loadVoices;
function pickVoice(region){
  const lang=region==='UK'?'en-GB':'en-US';
  return voices.find(v=>v.lang===lang)||voices.find(v=>v.lang&&v.lang.startsWith('en-'));
}
function speak(text,region,btn){
  speechSynthesis.cancel();
  document.querySelectorAll('button').forEach(b=>b.classList.remove('speaking'));
  const u=new SpeechSynthesisUtterance(text),v=pickVoice(region);
  if(v){u.voice=v;u.lang=v.lang}else u.lang=region==='UK'?'en-GB':'en-US';
  u.rate=.85;u.pitch=1;btn.classList.add('speaking');
  u.onend=()=>btn.classList.remove('speaking');
  u.onerror=()=>btn.classList.remove('speaking');
  speechSynthesis.speak(u);
}
</script>
</body>
</html>
