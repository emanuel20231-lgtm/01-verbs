<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron — palavra / IPA / áudio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121214;
            color: #e1e1e6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            margin-bottom: 24px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #a8a8b3;
            font-size: 0.95rem;
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .card {
            background-color: #202024;
            border-radius: 8px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #29292e;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s ease;
        }

        .card:hover {
            border-color: #323238;
        }

        .word-info {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .word {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            min-width: 110px;
        }

        .ipa {
            font-family: "Lucida Sans Unicode", "DejaVu Sans", "Segoe UI Symbol", sans-serif;
            color: #a8a8b3;
            font-size: 0.95rem;
        }

        .audio-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-audio {
            background-color: #121214;
            color: #e1e1e6;
            border: 1px solid #323238;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-audio:hover {
            background-color: #29292e;
            border-color: #4d4d57;
            color: #ffffff;
        }

        .btn-audio:active {
            transform: scale(0.96);
        }

        .btn-audio svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        footer {
            color: #7c7c8a;
            font-size: 0.85rem;
        }

        @media (max-width: 600px) {
            .card {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            .word-info {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }

            .audio-buttons {
                width: 100%;
            }

            .btn-audio {
                flex: 1;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Iron — palavra / IPA / áudio</h1>
            <p class="subtitle">Clique em GB UK ou US US para ouvir cada forma.</p>
        </header>

        <main class="card-list">
            <!-- Infinitive / Base -->
            <div class="card">
                <div class="word-info">
                    <span class="word">iron</span>
                    <span class="ipa">/UK ˈaɪən/ /US ˈaɪərn/</span>
                </div>
                <div class="audio-buttons">
                    <button class="btn-audio" onclick="speak('iron', 'en-GB')">
                        <small>GB</small>
                        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        UK
                    </button>
                    <button class="btn-audio" onclick="speak('iron', 'en-US')">
                        <small>US</small>
                        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        US
                    </button>
                </div>
            </div>

            <!-- 3rd Person Singular -->
            <div class="card">
                <div class="word-info">
                    <span class="word">irons</span>
                    <span class="ipa">/UK ˈaɪənz/ /US ˈaɪərnz/</span>
                </div>
                <div class="audio-buttons">
                    <button class="btn-audio" onclick="speak('irons', 'en-GB')">
                        <small>GB</small>
                        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        UK
                    </button>
                    <button class="btn-audio" onclick="speak('irons', 'en-US')">
                        <small>US</small>
                        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        US
                    </button>
                </div>
            </div>

            <!-- Gerund -->
            <div class="card">
                <div class="word-info">
                    <span class="word">ironing</span>
                    <span class="ipa">/UK ˈaɪən.ɪŋ/ /US ˈaɪərn.ɪŋ/</span>
                </div>
                <div class="audio-buttons">
                    <button class="btn-audio" onclick="speak('ironing', 'en-GB')">
                        <small>GB</small>
                        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        UK
                    </button>
                    <button class="btn-audio" onclick="speak('ironing', 'en-US')">
                        <small>US</small>
                        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        US
                    </button>
                </div>
            </div>

            <!-- Past Participle -->
            <div class="card">
                <div class="word-info">
                    <span class="word">ironed</span>
                    <span class="ipa">/UK ˈaɪənd/ /US ˈaɪərnd/</span>
                </div>
                <div class="audio-buttons">
                    <button class="btn-audio" onclick="speak('ironed', 'en-GB')">
                        <small>GB</small>
                        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        UK
                    </button>
                    <button class="btn-audio" onclick="speak('ironed', 'en-US')">
                        <small>US</small>
                        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        US
                    </button>
                </div>
            </div>
        </main>

        <footer>
            <p>A pronúncia é reproduzida pela síntese de voz do navegador (Velocidade: 0.5x).</p>
        </footer>
    </div>

    <script>
        function speak(text, lang) {
            // Cancela reproduções anteriores para não acumular áudios
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang; // 'en-GB' ou 'en-US'
            utterance.rate = 0.5;  // Velocidade reduzida conforme solicitado

            // Busca vozes instaladas no sistema do usuário que atendam à região solicitada
            const voices = window.speechSynthesis.getVoices();
            const selectedVoice = voices.find(voice => voice.lang === lang || voice.lang.replace('_', '-') === lang);

            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        // Garante o carregamento prévio das vozes no Chrome/Safari
        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };
    </script>
</body>
</html>
