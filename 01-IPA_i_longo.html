<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronúncia IPA /iː/ - Inglês (Modo Noturno)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0a1128 0%, #001f3f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #90cdf4;
        }
        .card {
            background: #0f172a;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            max-width: 850px;
            width: 95%;
            border: 1px solid #1e3a8a;
            display: flex;
            flex-direction: row;
            gap: 35px;
            align-items: center;
        }
        .content-side {
            flex: 1.2;
            text-align: center;
        }
        .image-side {
            flex: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .image-side img {
            width: 100%;
            max-width: 260px;
            height: auto;
            border-radius: 12px;
            border: 2px solid #1e3a8a;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        .image-caption {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #64748b;
        }
        h1 {
            font-size: 1.3rem;
            margin-bottom: 8px;
            color: #bee3f8;
        }
        .ipa-symbol {
            font-size: 3.5rem;
            font-weight: bold;
            color: #63b3ed;
            margin: 10px 0;
            font-family: 'Times New Roman', serif;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(99, 179, 237, 0.3);
        }
        .description {
            font-size: 0.85rem;
            color: #90cdf4;
            margin-bottom: 18px;
            line-height: 1.4;
        }
        .examples {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .example-badge {
            background: #1e3a8a;
            color: #90cdf4;
            padding: 4px 8px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            border: 1px solid #3b82f6;
        }
        .btn {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 11px 18px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-bottom: 8px;
        }
        .btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.6);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn-secondary {
            background: #1e293b;
            color: #90cdf4;
            box-shadow: none;
            border: 1px solid #334155;
            padding: 9px 14px;
            font-size: 0.85rem;
        }
        .btn-secondary:hover {
            background: #334155;
            color: #ffffff;
            box-shadow: none;
        }
        .word-buttons {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .status {
            margin-top: 8px;
            font-size: 0.75rem;
            color: #64748b;
            min-height: 16px;
        }

        @media (max-width: 768px) {
            .card {
                flex-direction: column;
                padding: 25px;
            }
        }
    </style>
</head>
<body>

    <!-- adicione seu mp3 aqui. O GitHub permite fazer upload de audio.mp3 direto no repositório. -->
    <audio id="ipaAudio" preload="auto">
        <source src="audio-ipa.mp3" type="audio/mpeg">
        Seu navegador não suporta reprodução de áudio.
    </audio>

    <div class="card">
        <!-- Lado Esquerdo: Textos, Símbolo e Botões -->
        <div class="content-side">
            <h1>Som IPA em Inglês</h1>
            <div class="ipa-symbol">/iː/</div>
            <p class="description">
                Vogal longa fechada anterior não-arredondada (som longo de "i", como em <em>see</em>, <em>sheep</em> ou <em>bean</em>).
            </p>

            <div class="examples">
                <span class="example-badge">see /siː/</span>
                <span class="example-badge">sheep /ʃiːp/</span>
                <span class="example-badge">bean /biːn/</span>
            </div>

            <!-- Botão de áudio do arquivo MP3 -->
            <button class="btn" onclick="playIpaAudio()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                </svg>
                Ouvir Som (/iː/)
            </button>

            <!-- Botões das palavras utilizando a síntese de voz do navegador -->
            <div class="word-buttons">
                <button class="btn btn-secondary" onclick="speakWord('see')">
                    🔊 Ouvir "see"
                </button>
                <button class="btn btn-secondary" onclick="speakWord('sheep')">
                    🔊 Ouvir "sheep" (/ʃiːp/)
                </button>
                <button class="btn btn-secondary" onclick="speakWord('bean')">
                    🔊 Ouvir "bean" (/biːn/)
                </button>
            </div>

            <div id="status" class="status"></div>
        </div>

    <script>
        function playIpaAudio() {
            const audio = document.getElementById('ipaAudio');
            const statusDiv = document.getElementById('status');
            
            audio.currentTime = 0;
            
            audio.play().then(() => {
                statusDiv.textContent = 'Reproduzindo áudio do repositório...';
                statusDiv.style.color = '#63b3ed';
            }).catch(error => {
                statusDiv.textContent = 'Certifique-se de que o arquivo "audio-ipa.mp3" foi enviado ao seu GitHub.';
                statusDiv.style.color = '#f87171';
            });

            audio.onended = () => {
                statusDiv.textContent = '';
            };
        }

        function speakWord(text) {
            const statusDiv = document.getElementById('status');
            
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.8;
                
                utterance.onstart = () => {
                    statusDiv.textContent = `Reproduzindo "${text}" via IA...`;
                    statusDiv.style.color = '#90cdf4';
                };
                
                utterance.onend = () => {
                    statusDiv.textContent = '';
                };

                utterance.onerror = () => {
                    statusDiv.textContent = 'Erro na síntese de voz do navegador.';
                    statusDiv.style.color = '#f87171';
                };
                
                window.speechSynthesis.speak(utterance);
            } else {
                statusDiv.textContent = 'Seu navegador não suporta a voz de IA.';
                statusDiv.style.color = '#f87171';
            }
        }
    </script>
