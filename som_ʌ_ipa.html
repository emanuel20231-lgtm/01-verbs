<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Som IPA /ʌ/</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b132b; /* Dark blue theme background */
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between text-slate-100">

    <!-- Header -->
    <header class="w-full py-6 px-4 text-center bg-[#1c2541]/80 backdrop-blur-md border-b border-blue-900/40 shadow-md">
        <h1 class="text-2xl md:text-3xl font-bold text-blue-400">Som IPA em Inglês</h1>
        <p class="text-sm text-slate-400 mt-1">Guia Interativo de Pronúncia</p>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-[#1c2541] rounded-2xl shadow-2xl p-6 md:p-8 text-center border border-blue-800/50">
            
            <!-- IPA Symbol Badge -->
            <div class="inline-block bg-blue-950 text-blue-300 font-extrabold text-4xl md:text-5xl px-6 py-3 rounded-2xl shadow-inner mb-4 border border-blue-800 tracking-wider">
                /ʌ/
            </div>

            <h2 class="text-lg font-semibold mb-1 text-slate-200">Vogal curta /ʌ/</h2>
            <p class="text-xs text-slate-400 mb-6">Som curto e aberto produzido na garganta (ex: sun, cup, bus).</p>

            <!-- IMAGE PLACEHOLDER COMMENT -->
            <!-- COLOQUE AQUI O LINK DA SUA IMAGEM NO ATRIBUTO SRC ABAIXO -->
            <div class="mb-6 flex justify-center">
                <img src="https://placehold.co/300x180/131b31/60a5fa?text=Imagem+do+Som+%2F%CA%8C%2F" 
                     alt="IPA /ʌ/ Illustration" 
                     class="rounded-xl shadow-md object-cover max-h-44 w-full border border-blue-900/60"
                     onerror="this.src='https://placehold.co/300x180/131b31/60a5fa?text=Erro+ao+carregar+imagem'">
            </div>

            <!-- Words Grid -->
            <div class="grid grid-cols-3 gap-3 mb-6">
                <!-- Word 1: Sun -->
                <button onclick="speakWord('sun')" 
                    class="group flex flex-col items-center justify-center p-3 bg-[#131b31] hover:bg-blue-600 border border-blue-800/80 rounded-xl transition-all duration-200 shadow-sm hover:shadow-lg cursor-pointer active:scale-95">
                    <span class="text-base font-bold text-blue-300 group-hover:text-white">sun</span>
                    <span class="text-xs text-blue-400/80 group-hover:text-blue-100 mt-1">/sʌn/</span>
                </button>

                <!-- Word 2: Cup -->
                <button onclick="speakWord('cup')" 
                    class="group flex flex-col items-center justify-center p-3 bg-[#131b31] hover:bg-blue-600 border border-blue-800/80 rounded-xl transition-all duration-200 shadow-sm hover:shadow-lg cursor-pointer active:scale-95">
                    <span class="text-base font-bold text-blue-300 group-hover:text-white">cup</span>
                    <span class="text-xs text-blue-400/80 group-hover:text-blue-100 mt-1">/kʌp/</span>
                </button>

                <!-- Word 3: Bus -->
                <button onclick="speakWord('bus')" 
                    class="group flex flex-col items-center justify-center p-3 bg-[#131b31] hover:bg-blue-600 border border-blue-800/80 rounded-xl transition-all duration-200 shadow-sm hover:shadow-lg cursor-pointer active:scale-95">
                    <span class="text-base font-bold text-blue-300 group-hover:text-white">bus</span>
                    <span class="text-xs text-blue-400/80 group-hover:text-blue-100 mt-1">/bʌs/</span>
                </button>
            </div>

            <!-- Global Action Button -->
            <button onclick="speakWord('sun, cup, bus')" 
                class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl shadow-lg transition-all duration-200 cursor-pointer flex items-center justify-center gap-2 active:scale-98 border border-blue-400/30">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                Ouvir Todas (0.5x)
            </button>

            <!-- Status message box -->
            <div id="statusMessage" class="mt-4 text-xs text-slate-400 min-h-[1rem]"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full py-4 text-center text-xs text-slate-500 bg-[#1c2541]/40 border-t border-blue-900/20">
        Phonics Learning Tool &bull; Web Speech API (0.5x Speed)
    </footer>

    <script>
        // Function to handle browser speech synthesis at 0.5x speed
        function speakWord(text) {
            const statusDiv = document.getElementById('statusMessage');

            if (!('speechSynthesis' in window)) {
                statusDiv.textContent = "Desculpe, seu navegador não suporta síntese de fala.";
                statusDiv.className = "mt-4 text-xs text-red-400 min-h-[1rem]";
                return;
            }

            // Cancel any ongoing speech utterances
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.5; // Velocidade exigida: 0.5x
            utterance.pitch = 1.0;

            utterance.onstart = function() {
                statusDiv.textContent = `Reproduzindo: "${text}" (0.5x)...`;
                statusDiv.className = "mt-4 text-xs text-blue-400 font-medium min-h-[1rem]";
            };

            utterance.onend = function() {
                statusDiv.textContent = "Reprodução concluída.";
                statusDiv.className = "mt-4 text-xs text-slate-400 min-h-[1rem]";
            };

            utterance.onerror = function() {
                statusDiv.textContent = "Erro ao reproduzir áudio.";
                statusDiv.className = "mt-4 text-xs text-red-400 min-h-[1rem]";
            };

            window.speechSynthesis.speak(utterance);
        }
    </script>

</body>
</html>
