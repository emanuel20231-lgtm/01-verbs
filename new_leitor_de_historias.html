<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de Texto - Voz do Navegador</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .controls {
            position: sticky;
            top: 0;
            background-color: #1e1e1e;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            z-index: 1000;
            width: 100%;
            max-width: 800px;
        }

        button, select, input {
            background-color: #2e2e2e;
            color: #ffffff;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover, select:hover {
            background-color: #3e3e3e;
        }

        .speed-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .speed-container input[type="range"] {
            cursor: pointer;
        }

        .input-container {
            width: 100%;
            max-width: 800px;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background-color: #1e1e1e;
            color: #ffffff;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
            font-family: inherit;
        }

        .text-container {
            max-width: 800px;
            width: 100%;
            line-height: 1.6;
            font-size: 18px;
        }

        .text-container p {
            margin: 8px 0;
            padding: 6px 10px;
            border-radius: 4px;
            transition: background-color 0.2s ease;
            cursor: pointer;
        }

        .highlight {
            background-color: #37474f;
            color: #80d8ff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="controls">
        <button id="btnPlay">Play</button>
        <button id="btnPause">Pause</button>

        <div>
            <label for="voiceSelect">Voz:</label>
            <select id="voiceSelect"></select>
        </div>

        <div class="speed-container">
            <label for="speedRange">Velocidade:</label>
            <input type="range" id="speedRange" min="0.1" max="2" step="0.05" value="1">
            <span id="speedValue">1.0x</span>
        </div>
    </div>

    <div class="input-container">
        <!-- deposite sua história aqui -->
        <textarea id="storyInput" placeholder="Cole ou digite sua história aqui...">Dick asked Tom...did you catch three fish?...Tom answered...yes I did.</textarea>
    </div>

    <div class="text-container" id="textContent"></div>

    <script>
        const synth = window.speechSynthesis;
        const voiceSelect = document.getElementById('voiceSelect');
        const speedRange = document.getElementById('speedRange');
        const speedValue = document.getElementById('speedValue');
        const btnPlay = document.getElementById('btnPlay');
        const btnPause = document.getElementById('btnPause');
        const storyInput = document.getElementById('storyInput');
        const textContent = document.getElementById('textContent');

        let voices = [];
        let currentIndex = 0;
        let isPlaying = false;
        let paragraphs = [];

        function loadVoices() {
            voices = synth.getVoices();
            if (voices.length === 0) return;

            const selectedIndex = voiceSelect.value;
            voiceSelect.innerHTML = '';
            
            voices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${voice.name} (${voice.lang})`;
                if (voice.lang.startsWith('en')) {
                    option.selected = true;
                }
                voiceSelect.appendChild(option);
            });

            if (selectedIndex !== "" && voices[selectedIndex]) {
                voiceSelect.value = selectedIndex;
            }
        }

        // Carregamento de vozes compatível com Android
        loadVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }

        // Tenta carregar as vozes em intervalo para resolver a lentidão do Android
        const voiceInterval = setInterval(() => {
            if (voices.length === 0) {
                loadVoices();
            } else {
                clearInterval(voiceInterval);
            }
        }, 300);

        speedRange.addEventListener('input', () => {
            speedValue.textContent = `${parseFloat(speedRange.value).toFixed(2)}x`;
        });

        function processText() {
            let rawText = storyInput.value;

            // Remove números no formato "1)", "1.", ou números soltos
            rawText = rawText.replace(/\b\d+[\.\)]?/g, '');

            // Divide por: reticências (... ou …), ., ?, !, ,, :, ;, (, {, —, –, -
            // A quebra ocorre após a pontuação ou após a abertura dos parênteses/chaves
            const sentences = rawText.split(/(?<=\.\.\.|\u2026|[.?!,;:—–\-])\s*|(?=[({])\s*/);

            textContent.innerHTML = '';
            sentences.forEach((sentence) => {
                // Remove pontuações isoladas de sobram que poderiam gerar linhas como "."
                const trimmed = sentence.trim();
                if (trimmed.length > 0 && !/^[.?,;:!—–\-]+$/.test(trimmed)) {
                    const p = document.createElement('p');
                    p.textContent = trimmed;
                    textContent.appendChild(p);
                }
            });

            paragraphs = document.querySelectorAll('#textContent p');

            // Adiciona evento de clique a cada frase/trecho
            paragraphs.forEach((p, index) => {
                p.addEventListener('click', () => {
                    isPlaying = false;
                    synth.cancel();
                    currentIndex = index;
                    setTimeout(() => {
                        isPlaying = true;
                        playCurrentLine();
                    }, 50);
                });
            });
        }

        function playCurrentLine() {
            if (!isPlaying || currentIndex >= paragraphs.length) {
                isPlaying = false;
                return;
            }

            paragraphs.forEach(p => p.classList.remove('highlight'));
            const currentP = paragraphs[currentIndex];
            currentP.classList.add('highlight');
            currentP.scrollIntoView({ behavior: 'smooth', block: 'center' });

            const utterance = new SpeechSynthesisUtterance(currentP.textContent);

            if (voices[voiceSelect.value]) {
                utterance.voice = voices[voiceSelect.value];
            }

            utterance.rate = parseFloat(speedRange.value);

            utterance.onend = () => {
                if (isPlaying) {
                    currentIndex++;
                    playCurrentLine();
                }
            };

            utterance.onerror = () => {
                if (isPlaying) {
                    currentIndex++;
                    playCurrentLine();
                }
            };

            synth.speak(utterance);
        }

        btnPlay.addEventListener('click', () => {
            if (synth.paused) {
                synth.resume();
            } else {
                isPlaying = false;
                synth.cancel();

                setTimeout(() => {
                    isPlaying = true;
                    playCurrentLine();
                }, 50);
            }
        });

        btnPause.addEventListener('click', () => {
            if (synth.speaking && !synth.paused) {
                synth.pause();
            }
        });

        function restartSpeech() {
            if (isPlaying && !synth.paused) {
                isPlaying = false;
                synth.cancel();
                setTimeout(() => {
                    isPlaying = true;
                    playCurrentLine();
                }, 50);
            }
        }

        storyInput.addEventListener('input', () => {
            isPlaying = false;
            synth.cancel();
            currentIndex = 0;
            processText();
        });

        speedRange.addEventListener('change', restartSpeech);
        voiceSelect.addEventListener('change', restartSpeech);

        // Processa o texto no início
        processText();
    </script>
</body>
</html>
